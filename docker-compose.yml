version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gloria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gloria
      POSTGRES_PASSWORD: gloria123
      POSTGRES_DB: gloria_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gloria_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gloria:gloria123@postgres:5432/gloria_db
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
